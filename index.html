<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大島町家族介護支援事業　映画上映会 予約</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section id="form-screen" class="panel">
    <div class="event-header">
      <h1 id="form-event-name">大島町家族介護支援事業<br>映画上映会</h1>
      <p id="form-event-date">開催日：令和8年11月13日（金）</p>
    </div>

    <form id="reservation-form">
      <div class="form-group">
        <label for="name">苗字 ※カタカナのみ</label>
        <input type="text" id="name" autocomplete="family-name" inputmode="text" maxlength="30" required>
      </div>

      <div class="form-group">
        <label for="area">居住地区</label>
        <select id="area" required>
          <option value="">選択してください</option>
          <option value="泉津">泉津</option>
          <option value="岡田">岡田</option>
          <option value="北の山">北の山</option>
          <option value="元町">元町</option>
          <option value="野増">野増</option>
          <option value="間伏">間伏</option>
          <option value="差木地">差木地</option>
          <option value="クダッチ">クダッチ</option>
          <option value="波浮港">波浮港</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">電話番号 ※半角数字のみ</label>
        <input type="tel" id="phone" autocomplete="tel" inputmode="numeric" pattern="[0-9]*" required>
      </div>

      <button type="submit" id="submit-button" disabled>予約する</button>
    </form>

    <p id="message" class="message"></p>
  </section>

  <section id="complete-screen" class="hidden">
    <div id="ticket" class="ticket">
      <div class="ticket-title">予約票</div>
      <div class="ticket-item"><div class="ticket-label">イベント</div><div id="ticket-event-name" class="ticket-value"></div></div>
      <div class="ticket-item"><div class="ticket-label">開催日</div><div id="ticket-event-date" class="ticket-value"></div></div>
      <div class="ticket-item"><div class="ticket-label">苗字</div><div id="ticket-name" class="ticket-value"></div></div>
      <div class="ticket-item"><div class="ticket-label">居住地区</div><div id="ticket-area" class="ticket-value"></div></div>
      <div class="reservation-area"><div class="ticket-label">予約番号</div><div id="ticket-reservation-number" class="reservation-number"></div></div>
      <div class="reception-area"><div class="reception-label">受付番号</div><div id="ticket-reception-number" class="reception-number"></div></div>
      <div class="ticket-notice">当日はこの予約票を受付でご提示ください。</div>
    </div>
    <button type="button" id="pdf-button" class="pdf-button">予約票PDFを開く</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="script.js?v=20260820-4"></script>
</body>
</html>
