<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>家族介護支援事業映画上映会｜ネット受付停止のお知らせ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f7; color: #202b36; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; line-height: 1.9; }
    main { max-width: 720px; margin: 64px auto; padding: 0 20px; }
    article { background: #fff; border: 1px solid #dce2e8; border-top: 6px solid #284f68; border-radius: 8px; padding: 36px; }
    h1 { margin: 0 0 28px; font-size: clamp(1.35rem, 4.8vw, 1.8rem); line-height: 1.6; overflow-wrap: anywhere; }
    h2 { color: #8b302b; font-size: 1.15rem; margin: 0 0 14px; }
    p { margin: 0 0 20px; }
    .contact { margin-top: 28px; padding: 22px; background: #edf3f7; border-radius: 6px; }
    .contact p { margin: 0; }
    .phone { display: inline-block; padding: 8px 0; font-size: clamp(1.15rem, 5vw, 1.65rem); font-weight: 700; color: #184d72; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #184d72; outline-offset: 4px; }
    @media (max-width: 480px) { main { margin: 24px auto; padding: 0 14px; } article { padding: 24px 20px; } .contact { padding: 18px 14px; } }
  </style>
</head>
<body>
  <main>
    <article aria-labelledby="event-title">
      <h1 id="event-title">家族介護支援事業映画上映会</h1>
      <h2>ネットでの受付停止のお知らせ</h2>
      <p>PHP重大脆弱性対策のためネットでの受付は停止しました。</p>
      <p>予約をご希望の方は大島町役場住民課まで直接お電話下さい。</p>
      <div class="contact">
        <p>電話番号</p>
        <a class="phone" href="tel:0499221462" aria-label="電話番号 04992-2-1462">０４９９２－２－１４６２</a>
        <p>大島町役場 住民課介護保険係</p>
      </div>
    </article>
  </main>
</body>
</html>
