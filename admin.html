<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="container">
  <section id="login-screen" class="panel">
    <h1>予約管理</h1>
    <h2>管理者ログイン</h2>
    <form id="login-form">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" required>
      <label for="password">パスワード</label>
      <input type="password" id="password" required>
      <button type="submit">ログイン</button>
    </form>
    <p id="login-message"></p>
  </section>

  <section id="admin-screen" class="hidden">
    <div class="admin-header">
      <h1>予約一覧</h1>
      <button type="button" id="logout-button" class="small-button">ログアウト</button>
    </div>

    <div class="controls">
      <button type="button" id="reload-button">一覧を更新</button>
      <button type="button" id="excel-button">Excel出力</button>
    </div>

    <p id="reservation-count"></p>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>受付番号</th>
            <th>予約番号</th>
            <th>苗字</th>
            <th>居住地区</th>
            <th>電話番号</th>
            <th>イベント</th>
            <th>開催日</th>
            <th>予約日時</th>
          </tr>
        </thead>
        <tbody id="reservation-table-body"></tbody>
      </table>
    </div>

    <p id="admin-message"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="admin.js?v=20260820-2"></script>
</body>
</html>
